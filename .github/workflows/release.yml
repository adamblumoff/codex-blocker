name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      cws_check_upload:
        description: "Also upload extension zip to CWS (no publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm i -g npm@11.5.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Verify versions match tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          server_version="$(node -p "require('./packages/server/package.json').version")"
          extension_version="$(node -p "require('./packages/extension/manifest.json').version")"
          extension_version_name="$(node -p "require('./packages/extension/manifest.json').version_name || ''")"
          if [ "$server_version" != "$tag" ]; then
            echo "Server version $server_version does not match tag $tag"
            exit 1
          fi
          if [[ "$tag" == *"-alpha."* ]]; then
            expected_extension_version="${tag/-alpha./.}"
            if [ "$extension_version" != "$expected_extension_version" ]; then
              echo "Extension version $extension_version does not match expected $expected_extension_version for tag $tag"
              exit 1
            fi
            if [ "$extension_version_name" != "$tag" ]; then
              echo "Extension version_name $extension_version_name does not match tag $tag"
              exit 1
            fi
          else
            if [ "$extension_version" != "$tag" ]; then
              echo "Extension version $extension_version does not match tag $tag"
              exit 1
            fi
          fi

      - name: Test
        run: pnpm test

      - name: Build server
        run: pnpm --filter codex-blocker build

      - name: Build extension
        run: pnpm --filter @codex-blocker/extension build

      - name: Zip extension
        run: pnpm --filter @codex-blocker/extension zip

      - name: Resolve Chrome Web Store publish gate
        id: cws_gate
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [[ "$tag" == *"-alpha"* ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Chrome Web Store publish for prerelease tag: $tag"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Chrome Web Store publish enabled for stable tag: $tag"
          fi

      - name: Validate Chrome Web Store secrets
        if: steps.cws_gate.outputs.enabled == 'true'
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          missing=0
          for var in CWS_EXTENSION_ID CWS_PUBLISHER_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Exchange Chrome Web Store access token
        id: cws_token
        if: steps.cws_gate.outputs.enabled == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          token_json="$(
            curl -sS -f https://oauth2.googleapis.com/token \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_id=${CWS_CLIENT_ID}" \
              --data-urlencode "client_secret=${CWS_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${CWS_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"
          token="$(echo "$token_json" | jq -r '.access_token // empty')"
          if [ -z "$token" ]; then
            echo "Failed to resolve access token from Google OAuth response"
            echo "$token_json"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "access_token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload extension to Chrome Web Store
        if: steps.cws_gate.outputs.enabled == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.cws_token.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          item_name="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"
          upload_url="https://chromewebstore.googleapis.com/upload/v2/${item_name}:upload?uploadType=media"
          status_url="https://chromewebstore.googleapis.com/v2/${item_name}:fetchStatus"
          upload_body_file="$(mktemp)"

          upload_status="$(
            curl -sS -X POST "$upload_url" \
              -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@packages/extension/codex-blocker.zip" \
              -o "$upload_body_file" \
              -w "%{http_code}"
          )"

          if [ "$upload_status" -lt 200 ] || [ "$upload_status" -ge 300 ]; then
            echo "Chrome Web Store upload request failed with HTTP $upload_status"
            cat "$upload_body_file"
            rm -f "$upload_body_file"
            exit 1
          fi

          upload_json="$(cat "$upload_body_file")"
          rm -f "$upload_body_file"

          upload_state="$(echo "$upload_json" | jq -r '.uploadState // empty')"
          if [ -z "$upload_state" ]; then
            echo "Upload response did not include uploadState"
            echo "$upload_json"
            exit 1
          fi

          case "$upload_state" in
            SUCCEEDED)
              echo "Extension upload succeeded."
              ;;
            IN_PROGRESS|UPLOAD_IN_PROGRESS)
              echo "Upload in progress, polling fetchStatus..."
              for attempt in $(seq 1 30); do
                sleep 10
                status_json="$(
                  curl -sS -f "$status_url" \
                    -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}"
                )"
                async_state="$(echo "$status_json" | jq -r '.lastAsyncUploadState // empty')"
                case "$async_state" in
                  SUCCEEDED)
                    echo "Async upload completed."
                    upload_state="SUCCEEDED"
                    break
                    ;;
                  IN_PROGRESS|UPLOAD_IN_PROGRESS|"")
                    echo "Attempt $attempt/30: upload still in progress."
                    ;;
                  FAILED|NOT_FOUND|UPLOAD_STATE_UNSPECIFIED)
                    echo "Async upload failed with state: $async_state"
                    echo "$status_json"
                    exit 1
                    ;;
                  *)
                    echo "Unexpected async upload state: $async_state"
                    echo "$status_json"
                    exit 1
                    ;;
                esac
              done

              if [ "$upload_state" != "SUCCEEDED" ]; then
                echo "Upload did not complete within polling window"
                exit 1
              fi
              ;;
            FAILED|NOT_FOUND|UPLOAD_STATE_UNSPECIFIED)
              echo "Upload failed with state: $upload_state"
              echo "$upload_json"
              exit 1
              ;;
            *)
              echo "Unexpected upload state: $upload_state"
              echo "$upload_json"
              exit 1
              ;;
          esac

      - name: Publish extension to Chrome Web Store
        if: steps.cws_gate.outputs.enabled == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.cws_token.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          item_name="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"
          publish_url="https://chromewebstore.googleapis.com/v2/${item_name}:publish"

          publish_json="$(
            curl -sS -f -X POST "$publish_url" \
              -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"publishType":"DEFAULT_PUBLISH"}'
          )"

          item_state="$(echo "$publish_json" | jq -r '.state // empty')"
          if [ -z "$item_state" ]; then
            echo "Publish response did not include state"
            echo "$publish_json"
            exit 1
          fi

          case "$item_state" in
            PUBLISHED|PENDING_REVIEW|STAGED|PUBLISHED_TO_TESTERS)
              echo "Publish accepted with state: $item_state"
              ;;
            CANCELLED|REJECTED|ITEM_STATE_UNSPECIFIED)
              echo "Publish failed with state: $item_state"
              echo "$publish_json"
              exit 1
              ;;
            *)
              echo "Unexpected publish state: $item_state"
              echo "$publish_json"
              exit 1
              ;;
          esac

      - name: Fetch Chrome Web Store status snapshot
        if: steps.cws_gate.outputs.enabled == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.cws_token.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          item_name="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"
          status_url="https://chromewebstore.googleapis.com/v2/${item_name}:fetchStatus"
          status_json="$(
            curl -sS -f "$status_url" \
              -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}"
          )"
          echo "$status_json" | jq '{
            name,
            itemId,
            lastAsyncUploadState,
            warned,
            takenDown,
            submittedState: .submittedItemRevisionStatus.state,
            publishedState: .publishedItemRevisionStatus.state
          }'

      - name: Resolve npm tag
        id: npm_tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [[ "$tag" == *"-alpha"* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        run: npm publish --tag "${{ steps.npm_tag.outputs.tag }}"
        working-directory: packages/server

      - name: Resolve release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          notes_file="docs/release${tag}.md"
          if [[ "$tag" == *"-alpha"* ]]; then
            if [ -f "$notes_file" ]; then
              echo "body_path=$notes_file" >> "$GITHUB_OUTPUT"
              echo "has_body=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_body=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ ! -f "$notes_file" ]; then
            echo "Missing release notes: $notes_file"
            exit 1
          fi

          echo "body_path=$notes_file" >> "$GITHUB_OUTPUT"
          echo "has_body=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release flags
        id: rel_flags
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [[ "$tag" == *"-alpha"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release (notes file)
        if: steps.notes.outputs.has_body == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/extension/codex-blocker.zip
          body_path: ${{ steps.notes.outputs.body_path }}
          prerelease: ${{ steps.rel_flags.outputs.prerelease }}
          make_latest: ${{ steps.rel_flags.outputs.make_latest }}

      - name: Create GitHub release (auto notes)
        if: steps.notes.outputs.has_body != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/extension/codex-blocker.zip
          generate_release_notes: true
          prerelease: ${{ steps.rel_flags.outputs.prerelease }}
          make_latest: ${{ steps.rel_flags.outputs.make_latest }}

  cws-smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Chrome Web Store secrets
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          missing=0
          for var in CWS_EXTENSION_ID CWS_PUBLISHER_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Exchange Chrome Web Store access token
        id: cws_token
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          token_json="$(
            curl -sS -f https://oauth2.googleapis.com/token \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_id=${CWS_CLIENT_ID}" \
              --data-urlencode "client_secret=${CWS_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${CWS_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"
          token="$(echo "$token_json" | jq -r '.access_token // empty')"
          if [ -z "$token" ]; then
            echo "Failed to resolve access token from Google OAuth response"
            echo "$token_json"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "access_token=$token" >> "$GITHUB_OUTPUT"

      - name: Fetch Chrome Web Store status snapshot
        env:
          CWS_ACCESS_TOKEN: ${{ steps.cws_token.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          item_name="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"
          status_url="https://chromewebstore.googleapis.com/v2/${item_name}:fetchStatus"
          status_json="$(
            curl -sS -f "$status_url" \
              -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}"
          )"
          echo "$status_json" | jq '{
            name,
            itemId,
            lastAsyncUploadState,
            warned,
            takenDown,
            submittedState: .submittedItemRevisionStatus.state,
            publishedState: .publishedItemRevisionStatus.state
          }'

      - name: Checkout (for optional upload smoke)
        if: github.event.inputs.cws_check_upload == 'true'
        uses: actions/checkout@v4

      - name: Setup Node (for optional upload smoke)
        if: github.event.inputs.cws_check_upload == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm (for optional upload smoke)
        if: github.event.inputs.cws_check_upload == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies (for optional upload smoke)
        if: github.event.inputs.cws_check_upload == 'true'
        run: pnpm install

      - name: Build extension (for optional upload smoke)
        if: github.event.inputs.cws_check_upload == 'true'
        run: pnpm --filter @codex-blocker/extension build

      - name: Zip extension (for optional upload smoke)
        if: github.event.inputs.cws_check_upload == 'true'
        run: pnpm --filter @codex-blocker/extension zip

      - name: Upload extension to Chrome Web Store (optional smoke)
        if: github.event.inputs.cws_check_upload == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.cws_token.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          item_name="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"
          upload_url="https://chromewebstore.googleapis.com/upload/v2/${item_name}:upload?uploadType=media"
          status_url="https://chromewebstore.googleapis.com/v2/${item_name}:fetchStatus"
          upload_body_file="$(mktemp)"

          upload_status="$(
            curl -sS -X POST "$upload_url" \
              -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@packages/extension/codex-blocker.zip" \
              -o "$upload_body_file" \
              -w "%{http_code}"
          )"

          if [ "$upload_status" -lt 200 ] || [ "$upload_status" -ge 300 ]; then
            echo "Chrome Web Store upload request failed with HTTP $upload_status"
            cat "$upload_body_file"
            rm -f "$upload_body_file"
            exit 1
          fi

          upload_json="$(cat "$upload_body_file")"
          rm -f "$upload_body_file"

          upload_state="$(echo "$upload_json" | jq -r '.uploadState // empty')"
          if [ -z "$upload_state" ]; then
            echo "Upload response did not include uploadState"
            echo "$upload_json"
            exit 1
          fi

          case "$upload_state" in
            SUCCEEDED)
              echo "Extension upload smoke test succeeded."
              ;;
            IN_PROGRESS|UPLOAD_IN_PROGRESS)
              echo "Upload in progress, polling fetchStatus..."
              for attempt in $(seq 1 30); do
                sleep 10
                status_json="$(
                  curl -sS -f "$status_url" \
                    -H "Authorization: Bearer ${CWS_ACCESS_TOKEN}"
                )"
                async_state="$(echo "$status_json" | jq -r '.lastAsyncUploadState // empty')"
                case "$async_state" in
                  SUCCEEDED)
                    echo "Async upload completed."
                    upload_state="SUCCEEDED"
                    break
                    ;;
                  IN_PROGRESS|UPLOAD_IN_PROGRESS|"")
                    echo "Attempt $attempt/30: upload still in progress."
                    ;;
                  FAILED|NOT_FOUND|UPLOAD_STATE_UNSPECIFIED)
                    echo "Async upload failed with state: $async_state"
                    echo "$status_json"
                    exit 1
                    ;;
                  *)
                    echo "Unexpected async upload state: $async_state"
                    echo "$status_json"
                    exit 1
                    ;;
                esac
              done

              if [ "$upload_state" != "SUCCEEDED" ]; then
                echo "Upload did not complete within polling window"
                exit 1
              fi
              ;;
            FAILED|NOT_FOUND|UPLOAD_STATE_UNSPECIFIED)
              echo "Upload failed with state: $upload_state"
              echo "$upload_json"
              exit 1
              ;;
            *)
              echo "Unexpected upload state: $upload_state"
              echo "$upload_json"
              exit 1
              ;;
          esac

      - name: Smoke test summary
        run: |
          if [ "${{ github.event.inputs.cws_check_upload }}" = "true" ]; then
            echo "CWS smoke test passed (auth + status + upload)."
          else
            echo "CWS smoke test passed (auth + status only)."
          fi
